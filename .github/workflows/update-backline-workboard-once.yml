name: Log next Backline source once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    if: contains(github.event.head_commit.message, 'Log OnTheCaseMusic next Backline source')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Record OnTheCaseMusic as next source
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'public/workboard.json';
          const board = JSON.parse(fs.readFileSync(path, 'utf8'));
          board.updatedAt = new Date().toISOString();
          board.updatedBy = 'ChatGPT BNDY Backline source sequencing';
          const lane = board.lanes.find(x => x.id === 'source-automation');
          if (!lane) throw new Error('source-automation lane not found');
          lane.next ||= [];
          const item = {
            title: 'OnTheCaseMusic into BNDY Backline',
            detail: 'Next external source after the existing canonical BNDY corpus bootstrap. Assess and ingest OnTheCaseMusic through the same Backline evidence → Observation → atomised Claim → resolution pipeline, preserving source-native identities and keeping canonical projection separately governed.'
          };
          const idx = lane.next.findIndex(x => x.title === item.title);
          if (idx >= 0) lane.next[idx] = item; else lane.next.unshift(item);
          fs.writeFileSync(path, JSON.stringify(board));
          NODE
          node -e "JSON.parse(require('fs').readFileSync('public/workboard.json','utf8')); console.log('workboard valid')"
      - name: Commit workboard
        run: |
          git config user.name 'bndy-backline-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add public/workboard.json
          git commit -m 'Record OnTheCaseMusic as next Backline source'
          git pull --rebase --autostash origin main
          git push origin HEAD:main
