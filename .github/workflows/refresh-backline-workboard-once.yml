name: Refresh Backline workboard once
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  refresh:
    if: github.event.head_commit.message == 'Refresh Backline workboard'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Update Backline lane
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('public/workboard.json')
          d=json.loads(p.read_text())
          lane=next(x for x in d['lanes'] if x['id']=='intelligence')
          def upsert(section,title,detail,evidence=None):
              items=lane[section]
              item={'title':title,'detail':detail}
              if evidence: item['evidence']=evidence
              for i,x in enumerate(items):
                  if x['title']==title: items[i]=item; return
              items.append(item)
          upsert('done','Lemonrock low-cost steady state deployed','Hourly new-gig and cancellation sweeps are deployed. Artist and venue directory crawling is off; profiles hydrate only from gig-led discovery. SourceDispatcher is now hourly to reduce idle AWS invocations.', ['https://github.com/flowency-live/bndy-enrichment/blob/main/ops/lemonrock-low-cost-operating-status.json'])
          upsert('done','On The Case gig-led adapter merged','On The Case now has source-native IDs, structural safety gates, bounded gig -> venue -> band fanout, unresolved open-mic/buskers handling, hourly gig scheduling, owned reconciliation lineage and completion controls. Canonical writes remain off.', ['https://github.com/flowency-live/bndy-enrichment/pull/25'])
          upsert('done','GigsNews stale-edition protection','A stale rendered edition is downgraded from complete so it cannot generate destructive withdrawals.')
          upsert('done','Scenic Eye adapter merged shadow/manual','Scenic Eye weekly-edition ingestion is implemented with derived identities and stale-edition protection. It remains unscheduled pending a source-specific cadence decision.', ['https://github.com/flowency-live/bndy-enrichment/pull/27'])
          upsert('done','Insangel and Norfolk reconnaissance retained','Both sources are explicitly fixture/AWS-reachability gated. No blind adapters or acquisition-evasion work will proceed.', ['https://github.com/flowency-live/bndy-enrichment/pull/26'])
          upsert('now','On The Case shadow completion evidence','Production shadow bootstrap/completion workflow is the current activation gate. Do not enable canonical writes; require clean reconciliation lineage plus empty queue/DLQ evidence.')
          upsert('next','Daily Backline discovery metrics','Publish a daily source-family view of discovered gigs, additions, withdrawals, unresolved identities, failures and coverage so Backline progress is visible without reconstructing logs.')
          upsert('next','Generic entity enrichment worker','Continuously improve Artists and Venues BNDY actually holds using freshness/quality gaps and source evidence, instead of every source inventing recurring directory crawlers.')
          d['updatedAt']='2026-08-26T18:48:00.000Z'
          d['updatedBy']='Backline source productionisation'
          p.write_text(json.dumps(d,separators=(',',':'))+'\n')
          PY
      - name: Commit and clean up
        run: |
          git config user.name "bndy-backline-bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/refresh-backline-workboard-once.yml .workboard-refresh-trigger
          git add public/workboard.json
          git commit -m "Refresh Backline workboard after source productionisation"
          git push origin HEAD:main
